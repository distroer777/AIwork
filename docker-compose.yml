# Только база данных. Приложение запускается локально: npm run dev.
# Все значения берутся из файла .env (см. .env.example).
services:
  db:
    image: postgres:17-alpine
    container_name: yarchinvest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Только с этого компьютера (127.0.0.1), порт не 5432: он занят локальным Postgres
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - yarchinvest-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  yarchinvest-db-data:
