# Только база данных. Приложение запускается локально: npm run dev.
# Все значения берутся из файла .env (см. .env.example).
services:
  db:
    image: postgres:17-alpine
    container_name: yarchinvest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Только с этого компьютера (127.0.0.1), порт не 5432: он занят локальным Postgres
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - yarchinvest-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Файловое хранилище, совместимое с S3 (для разработки). В проде это VK Cloud Object Storage.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: yarchinvest-minio
    restart: unless-stopped
    # Bitnami-образ: консоль на 9001 включена по умолчанию, данные в /bitnami/minio/data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET}
    ports:
      - "127.0.0.1:${S3_PORT}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT}:9001"
    volumes:
      - yarchinvest-minio-data:/bitnami/minio/data

volumes:
  yarchinvest-db-data:
  yarchinvest-minio-data:
